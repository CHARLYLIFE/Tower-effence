<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inverted Tower Defense</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="game-container">
        <!-- Canvas donde se dibuja el mapa y los duendes -->
        <canvas id="gameCanvas" width="360" height="520"></canvas>

        <!-- Panel de Botones para Invocación de Unidades -->
        <div id="ui-panel">
            <button id="btn-goblin" class="unit-btn">
                <span class="unit-name">DUENDE</span>
                <span class="unit-cost">💧 25 Mana</span>
            </button>
        </div>
    </div>

    <!-- Carga segura del script del juego -->
    <script src="js/screen/GameScreen.js" onload="initGame()"></script>
    <script>
        let game = null;

        function initGame() {
            const canvas = document.getElementById('gameCanvas');
            game = new GameScreen(canvas);

            document.getElementById('btn-goblin').addEventListener('click', () => {
                if (game) {
                    game.spawnGoblin();
                }
            });
        }
    </script>
</body>
</html>
