<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inverted Tower Defense</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="game-container">
        <!-- Canvas de juego -->
        <canvas id="gameCanvas" width="360" height="520"></canvas>

        <!-- Panel de control de unidades -->
        <div id="ui-panel">
            <button id="btn-goblin" class="unit-btn">
                <span class="unit-name">DUENDE</span>
                <span class="unit-cost">💧 25 Mana</span>
            </button>
        </div>
    </div>

    <!-- Carga diferida del script para garantizar que el HTML esté listo -->
    <script src="js/screen/GameScreen.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const game = new GameScreen(canvas);

            document.getElementById('btn-goblin').addEventListener('click', () => {
                game.spawnGoblin();
            });
        });
    </script>
</body>
</html>
